<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bgsd · live view</title>
<style>
  :root {
    /* Neumorphic surface + banner-matched accents. Soft dual-shadow UI on a
       single mid-dark surface; accents (kiwi/emerald/violet) only for status. */
    --bg: #171b23; --surface: #171b23; --surface-2: #151922;
    --ink: #E7EAF1; --ink-2: #C1C9D8; --muted: #8A94A6; --muted-2: #6C7788;
    --kiwi: #A3E635; --kiwi-deep: #7FB03A; --kiwi-ink: #0a1305; --kiwi-dim: #1b2a10;
    --emerald: #34D399; --emerald-deep: #2A7A5C;
    --violet: #8A63D2; --violet-2: #A78BFA;
    --run: #58a6ff; --warn: #F0B429; --bad: #F85149; --done: #34D399;
    /* Neumorphic shadow pair (dark bottom-right, light top-left). */
    --nm-d: rgba(4,6,10,.66); --nm-l: rgba(255,255,255,.038);
    --raise: 6px 6px 15px var(--nm-d), -6px -6px 15px var(--nm-l);
    --raise-sm: 3px 3px 8px var(--nm-d), -3px -3px 8px var(--nm-l);
    --inset: inset 3px 3px 7px var(--nm-d), inset -2px -2px 6px var(--nm-l);
    --inset-sm: inset 2px 2px 5px var(--nm-d), inset -1px -1px 3px var(--nm-l);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    font: 14px/1.45 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    background:
      radial-gradient(900px 620px at 14% 0%, rgba(138,99,210,.06), transparent 60%),
      radial-gradient(820px 620px at 86% 18%, rgba(52,211,153,.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
  }
  body > * { position: relative; z-index: 1; }
  .clean-sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* ---- Header --------------------------------------------------------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg); padding: 15px 22px 15px;
    box-shadow: 0 10px 22px -12px var(--nm-d);
  }
  header::after {
    content: ""; position: absolute; left: 22px; right: 22px; bottom: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--kiwi), var(--emerald) 50%, var(--violet), transparent);
    opacity: .55;
  }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); color: var(--kiwi); font-weight: 700;
    border-radius: 999px; padding: 6px 14px 6px 12px; letter-spacing: .2px;
    box-shadow: var(--raise-sm);
  }
  .pill .pemoji { font-size: 14px; line-height: 1; }
  @keyframes kbeat {
    0% { box-shadow: 0 0 0 0 rgba(163,230,53,.45); }
    70% { box-shadow: 0 0 0 7px rgba(163,230,53,0); }
    100% { box-shadow: 0 0 0 0 rgba(163,230,53,0); }
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; color: var(--ink-2); }
  .meta { color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 600; }
  .counts { display: flex; gap: 9px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  .chip {
    border: 0; border-radius: 9px; padding: 4px 11px; color: var(--muted);
    background: var(--surface); box-shadow: var(--raise-sm); transition: color .25s, box-shadow .25s;
  }
  .chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .chip.run b { color: var(--run); } .chip.done b { color: var(--done); } .chip.bad b { color: var(--bad); }
  .chip.pop { animation: chippop .5s ease; }
  @keyframes chippop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .overall {
    display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 5px 14px;
    font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); background: var(--surface); box-shadow: var(--raise-sm);
  }
  .overall .odot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .overall.running { color: var(--run); }
  .overall.done { color: var(--done); }
  .overall.blocked { color: var(--bad); }
  .overall.needs_input { color: var(--warn); }
  .overall.idle { color: var(--muted); }
  .overall.running .odot { animation: kbeat 1.8s ease-out infinite; }

  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .live .beat { width: 8px; height: 8px; border-radius: 50%; background: var(--kiwi); box-shadow: 0 0 0 0 var(--kiwi); animation: beat 1.6s infinite; }
  .live.stale .beat { background: var(--warn); animation: none; }
  .live.lost .beat { background: var(--bad); animation: none; }
  @keyframes beat { 0%{box-shadow:0 0 0 0 rgba(163,230,53,.5)} 70%{box-shadow:0 0 0 7px rgba(163,230,53,0)} 100%{box-shadow:0 0 0 0 rgba(163,230,53,0)} }

  /* Tab switcher (Current / All sessions) — inset track, raised active pill. */
  .tabs { display: inline-flex; gap: 5px; background: var(--surface); border-radius: 12px; padding: 5px; box-shadow: var(--inset-sm); }
  .tab { appearance: none; background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 12.5px; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: color .2s, box-shadow .2s, background .2s; }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--surface); color: var(--kiwi); font-weight: 700; box-shadow: var(--raise-sm); }
  .lock { color: var(--kiwi); }

  /* ---- The hero pipeline stepper ------------------------------------- */
  .hero {
    margin: 20px 22px 14px; padding: 20px 22px 12px; border-radius: 22px;
    background: var(--surface); box-shadow: var(--raise); position: relative; overflow: hidden;
  }
  .hero-label {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted-2);
    margin: 0 0 4px;
  }
  .hero-label b { color: var(--kiwi); font-weight: 700; letter-spacing: .3px; }
  .stepper-wrap { position: relative; width: 100%; overflow-x: auto; padding: 6px 0 2px; }
  #stepper { display: block; width: 100%; height: 132px; min-width: 720px; }

  /* SVG stepper node styling (classes set on <g>). */
  .snode .ring { fill: var(--surface-2); stroke: rgba(255,255,255,.05); stroke-width: 1.5; transition: stroke .3s, fill .3s; }
  .snode .core { fill: var(--surface-2); transition: fill .3s; }
  .snode .glow { opacity: 0; transition: opacity .4s; }
  .snode .slabel { fill: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .3px; transition: fill .3s; }
  .snode .snum { fill: var(--muted); font-size: 12px; font-weight: 700; transition: fill .3s; }
  .snode .tick { stroke: var(--kiwi-ink); stroke-width: 2.4; fill: none; opacity: 0; stroke-linecap: round; stroke-linejoin: round; transition: opacity .3s; }

  .snode.done .ring { fill: var(--kiwi-dim); stroke: var(--kiwi-deep); }
  .snode.done .core { fill: var(--kiwi); }
  .snode.done .tick { opacity: 1; }
  .snode.done .snum { opacity: 0; }
  .snode.done .slabel { fill: var(--done); }
  .snode.done .glow { opacity: .5; }

  .snode.active .ring { stroke: var(--kiwi); fill: #111A0C; }
  .snode.active .core { fill: var(--kiwi); }
  .snode.active .snum { fill: var(--kiwi-ink); }
  .snode.active .slabel { fill: var(--kiwi); font-weight: 700; }
  .snode.active .glow { opacity: 1; }
  .snode.active .pulse { animation: nodepulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes nodepulse {
    0% { opacity: .55; r: 20; } 70% { opacity: 0; r: 34; } 100% { opacity: 0; r: 34; }
  }
  .snode.pending .ring { stroke-dasharray: 3 4; opacity: .8; }
  .snode.pending .slabel { opacity: .7; }
  .snode.pending .snum { opacity: .8; }

  .sconn { stroke: rgba(255,255,255,.08); stroke-width: 2.5; fill: none; transition: stroke .3s; }
  .sconn.done { stroke: var(--kiwi-deep); }
  .sconn.active { stroke: url(#connGrad); }
  .flowdot { display: none; }
  .sconn-live .flowdot { display: inline; }

  /* ---- Conductor note bar -------------------------------------------- */
  .note-bar {
    margin: 12px 22px 14px; color: var(--ink-2); font-size: 12.5px; min-height: 20px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .note-bar .tag {
    display: inline-flex; align-items: center; gap: 6px; color: var(--kiwi);
    font-weight: 700; letter-spacing: .3px;
  }
  .note-bar .tag .spin {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.6px solid rgba(163,230,53,.25); border-top-color: var(--kiwi); animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note-bar .sep { color: var(--muted-2); }
  .note-bar .muted { color: var(--muted); font-weight: 400; }

  /* ---- Lanes ---------------------------------------------------------- */
  main { padding: 10px 22px 4px; }
  .lanes { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 18px; align-items: start; }
  @media (max-width: 1040px) { .lanes { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 580px) { .lanes { grid-template-columns: 1fr; } }
  .lane {
    background: var(--surface); border-radius: 18px; padding: 13px; min-height: 96px;
    position: relative; box-shadow: var(--raise);
  }
  .lane-head { display: flex; align-items: center; justify-content: space-between; margin: 3px 4px 12px; }
  .lane-title { font-weight: 600; font-size: 12px; letter-spacing: .4px; color: var(--ink-2); text-transform: uppercase; }
  .lane-count {
    color: var(--muted); font-size: 11px; min-width: 22px; text-align: center;
    border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums;
    background: var(--surface); box-shadow: var(--inset-sm);
  }
  /* Agent cards — raised, clickable, colored status accent via left stripe. */
  .card {
    position: relative; background: var(--surface); border-radius: 14px;
    padding: 12px 13px 12px 15px; margin-bottom: 12px; cursor: pointer;
    box-shadow: var(--raise-sm);
    transition: transform .14s cubic-bezier(.2,.7,.2,1), box-shadow .2s;
    animation: cardin .42s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before {
    content: ""; position: absolute; left: 6px; top: 12px; bottom: 12px; width: 3px; border-radius: 3px;
    background: var(--muted); opacity: .7;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--raise); }
  .card:active { transform: translateY(0); box-shadow: var(--inset-sm); }
  @keyframes cardin { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .card.running::before { background: var(--run); box-shadow: 0 0 10px rgba(88,166,255,.5); }
  .card.done::before { background: var(--done); box-shadow: 0 0 10px rgba(52,211,153,.45); }
  .card.blocked::before, .card.failed::before { background: var(--bad); box-shadow: 0 0 10px rgba(248,81,73,.5); }
  .card.needs_input::before, .card.stalled::before { background: var(--warn); box-shadow: 0 0 10px rgba(240,180,41,.45); }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .emoji { font-size: 15px; line-height: 1; filter: saturate(1.1); }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .role { font-size: 10px; color: var(--muted); border-radius: 6px; padding: 2px 7px; text-transform: uppercase; letter-spacing: .4px; background: var(--surface); box-shadow: var(--inset-sm); }
  .status { margin-left: auto; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; display: inline-flex; align-items: center; gap: 5px; }
  .status .sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status.running { color: var(--run); } .status.running .sdot { animation: kbeat 1.6s ease-out infinite; }
  .status.done { color: var(--done); }
  .status.blocked, .status.failed { color: var(--bad); } .status.needs_input, .status.stalled { color: var(--warn); }
  .sub { margin: 10px 0 8px; display: flex; align-items: center; gap: 8px; }
  .badge { background: var(--surface); color: #C6F08B; border-radius: 7px; padding: 2px 9px; font-size: 11px; box-shadow: var(--inset-sm); }
  .iter { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .bar { height: 7px; background: var(--surface); border-radius: 999px; overflow: hidden; margin-top: 4px; box-shadow: var(--inset-sm); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--kiwi-deep), var(--kiwi)); box-shadow: 0 0 8px rgba(163,230,53,.4); transition: width .5s cubic-bezier(.2,.7,.2,1); }

  /* Per-agent GSD mini-flow. */
  .flow { display: flex; align-items: flex-start; gap: 3px; margin-top: 10px; }
  .flow-step { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1 1 0; min-width: 0; position: relative; }
  .flow-step + .flow-step::before {
    content: ""; position: absolute; left: -50%; top: 7px; width: 100%; height: 1.4px; background: rgba(255,255,255,.07);
  }
  .flow-step.done::before, .flow-step.done + .flow-step::before { background: var(--kiwi-deep); }
  .flow-step .fdot { width: 15px; height: 15px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; line-height: 1; background: var(--surface); box-shadow: var(--inset-sm); color: var(--muted); position: relative; z-index: 1; }
  .flow-step .flabel { font-size: 8.5px; letter-spacing: .2px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; opacity: .8; }
  .flow-step.done .fdot { background: var(--kiwi-dim); color: #d6ffe4; box-shadow: none; }
  .flow-step.done .flabel { color: var(--done); opacity: 1; }
  .flow-step.active .fdot { background: var(--kiwi); color: var(--kiwi-ink); box-shadow: 0 0 0 3px rgba(163,230,53,.18); animation: kbeat 1.9s ease-out infinite; }
  .flow-step.active .flabel { color: var(--kiwi); font-weight: 700; opacity: 1; }
  .flow-step.blocked .fdot { background: var(--bad); color: #2a0d0c; box-shadow: none; }
  .flow-step.blocked .flabel { color: var(--bad); font-weight: 700; opacity: 1; }
  .flow-step.pending .fdot { opacity: .55; }
  .note { color: var(--muted); font-size: 11px; margin-top: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pressure { font-size: 10.5px; margin-top: 6px; }
  .pressure.elevated { color: var(--warn); } .pressure.critical { color: var(--bad); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 6px; opacity: .7; border-radius: 12px; box-shadow: var(--inset-sm); }
  .empty .ph { display: block; margin-top: 6px; font-size: 10.5px; opacity: .7; }

  footer { color: var(--muted); font-size: 11.5px; padding: 14px 22px 26px; text-align: center; }
  .view[hidden] { display: none; }

  /* ---- Sessions list -------------------------------------------------- */
  .sessions { display: flex; flex-direction: column; gap: 11px; }
  .sess {
    position: relative; display: grid; grid-template-columns: minmax(160px, 1.4fr) auto auto auto auto;
    align-items: center; gap: 12px; text-align: left; width: 100%;
    background: var(--surface); border-radius: 14px; padding: 13px 15px 13px 17px;
    color: var(--ink); font: inherit; cursor: pointer; box-shadow: var(--raise-sm);
    transition: transform .14s cubic-bezier(.2,.7,.2,1), box-shadow .2s;
  }
  .sess::before { content: ""; position: absolute; left: 7px; top: 13px; bottom: 13px; width: 3px; border-radius: 3px; background: var(--muted); opacity: .7; }
  .sess:hover { transform: translateY(-2px); box-shadow: var(--raise); }
  .sess.viewing { box-shadow: var(--raise), 0 0 0 1.5px rgba(163,230,53,.5); }
  .sess.st-in-progress::before { background: var(--run); box-shadow: 0 0 10px rgba(88,166,255,.5); }
  .sess.st-completed::before { background: var(--done); box-shadow: 0 0 10px rgba(52,211,153,.45); }
  .sess.st-aborted::before { background: var(--bad); box-shadow: 0 0 10px rgba(248,81,73,.5); }
  .sess-id { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-id .stage { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 2px; }
  .sess-scale { color: var(--muted); font-size: 11.5px; }
  .sbadge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; border-radius: 999px; padding: 3px 11px; white-space: nowrap; box-shadow: var(--inset-sm); }
  .sbadge.st-in-progress { color: var(--run); }
  .sbadge.st-completed { color: var(--done); }
  .sbadge.st-aborted { color: var(--bad); }
  .sess-counts { display: flex; gap: 6px; flex-wrap: wrap; }
  .sess-counts .chip { font-size: 11px; padding: 3px 9px; }
  .sess-when { color: var(--muted); font-size: 11px; white-space: nowrap; }
  @media (max-width: 720px) { .sess { grid-template-columns: 1fr auto; } .sess-scale, .sess-counts, .sess-when { grid-column: 1 / -1; } }

  /* ---- Card detail modal (click a card for the full description) ------ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(6,8,12,.62); backdrop-filter: blur(3px);
    animation: fadein .18s ease both;
  }
  .modal-overlay[hidden] { display: none; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    position: relative; width: min(560px, 100%); max-height: 84vh; overflow: auto;
    background: var(--surface); border-radius: 22px; padding: 22px 22px 20px;
    box-shadow: var(--raise), 0 24px 60px -20px rgba(0,0,0,.7);
    animation: modalin .22s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes modalin { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal-close {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border: 0; cursor: pointer;
    border-radius: 50%; background: var(--surface); color: var(--muted); font-size: 13px; line-height: 1;
    box-shadow: var(--raise-sm); transition: color .2s, box-shadow .15s;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-close:active { box-shadow: var(--inset-sm); }
  .m-head { display: flex; align-items: center; gap: 12px; margin: 2px 34px 16px 2px; }
  .m-head .m-emoji { font-size: 24px; line-height: 1; }
  .m-title { font-weight: 700; font-size: 15px; color: var(--ink); word-break: break-word; }
  .m-sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; letter-spacing: .2px; }
  .m-status { margin-left: auto; }
  .m-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .m-cell { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--inset-sm); }
  .m-cell .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted-2); }
  .m-cell .v { font-size: 13px; color: var(--ink-2); margin-top: 3px; font-variant-numeric: tabular-nums; word-break: break-word; }
  .m-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-2); margin: 4px 0 8px; }
  .m-note {
    background: var(--surface); border-radius: 12px; padding: 12px 14px; box-shadow: var(--inset-sm);
    color: var(--ink-2); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }
  .m-bar { height: 8px; background: var(--surface); border-radius: 999px; overflow: hidden; box-shadow: var(--inset-sm); margin-bottom: 16px; }
  .m-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--kiwi-deep), var(--kiwi)); box-shadow: 0 0 8px rgba(163,230,53,.4); }
  .m-flow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .m-flow .fstep { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 4px 11px; box-shadow: var(--inset-sm); }
  .m-flow .fstep .d { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .m-flow .fstep.done { color: var(--done); } .m-flow .fstep.active { color: var(--kiwi); font-weight: 700; }
  .m-flow .fstep.blocked { color: var(--bad); font-weight: 700; } .m-flow .fstep.pending { opacity: .6; }
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="pill"><span class="pemoji" id="pill-emoji">🥝</span><span id="pill-name">kiwi</span> · conductor</span>
    <h1 class="clean-sans" id="run-title">live view</h1>
    <span class="meta">run <b id="run-id">—</b> · scale <b id="run-scale">—</b> · <b id="run-state">—</b></span>
    <div class="counts">
      <span class="overall idle" id="overall"><span class="odot"></span><span id="overall-text">idle</span></span>
      <span class="chip run" id="chip-running">running <b id="c-running">0</b></span>
      <span class="chip done" id="chip-done">done <b id="c-done">0</b></span>
      <span class="chip bad" id="chip-blocked">blocked <b id="c-blocked">0</b></span>
      <span class="chip" id="chip-total">total <b id="c-total">0</b></span>
    </div>
  </div>
  <div class="top" style="margin-top:10px">
    <span class="tabs" role="tablist">
      <button class="tab active" id="tab-current" role="tab">Current</button>
      <button class="tab" id="tab-sessions" role="tab">All sessions</button>
    </span>
    <span class="meta" id="viewing-note" hidden></span>
    <span class="live" id="live"><span class="beat"></span><span id="live-text">connecting…</span></span>
    <span class="meta lock" style="margin-left:auto">&#128274; main-protected</span>
  </div>
</header>

<div class="view" id="view-current">
  <section class="hero">
    <div class="hero-label"><b>pipeline</b> · <span>one sesh, end to end</span> · <span id="hero-scope" class="muted" style="color:var(--muted)"></span></div>
    <div class="stepper-wrap">
      <svg id="stepper" viewBox="0 0 1000 132" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="run pipeline">
        <defs>
          <linearGradient id="connGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#A3E635"/>
            <stop offset="0.5" stop-color="#34D399"/>
            <stop offset="1" stop-color="#8A63D2"/>
          </linearGradient>
          <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#A3E635" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g id="stepper-conns"></g>
        <g id="stepper-nodes"></g>
      </svg>
    </div>
  </section>

  <div class="note-bar" id="note-bar"></div>
  <main><div class="lanes" id="lanes"></div></main>
</div>

<div class="view" id="view-sessions" hidden>
  <main><div class="sessions" id="sessions"></div></main>
</div>

<div class="modal-overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="agent details">
    <button class="modal-close" id="modal-close" aria-label="close">&#10005;</button>
    <div id="modal-body"></div>
  </div>
</div>

<footer>bgsd live view · polls every 1.5s · <span id="stamp">—</span></footer>

<script>
  var POLL_MS = 1500;
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function svg(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  // Progress from normalizeAgent's { index, total } (index/(total-1)).
  function pct(p) { if (!p || !p.total || p.total < 2) return p && p.index ? 100 : 0; return Math.round((p.index / (p.total - 1)) * 100); }
  function deriveOverall(c) {
    if (!c || !c.total) return "idle";
    if (c.blocked > 0) return "blocked";
    if (c.needs_input > 0) return "needs_input";
    if (c.running > 0) return "running";
    return "done";
  }
  // A tasteful emoji per role, derived from the agent's classified role.
  function roleEmoji(role) {
    return ({ verifier: "🔍", integrator: "🔀", reviewer: "🛡️", pipeline: "🧩" })[role] || "⚙️";
  }

  // ---- The hero pipeline stepper (SVG). Rebuilt when the stage set changes.
  var lastPipeSig = null;
  function renderPipeline(pipeline) {
    pipeline = pipeline || [];
    var svgEl = document.getElementById("stepper");
    var conns = document.getElementById("stepper-conns");
    var nodes = document.getElementById("stepper-nodes");

    // Layout inside the 1000 x 132 viewBox.
    var n = pipeline.length || 1;
    var padX = 60, top = 46, r = 19;
    var span = n > 1 ? (1000 - padX * 2) / (n - 1) : 0;
    var cx = function (i) { return padX + span * i; };

    // Rebuild the skeleton only when the stage identities change (not every poll),
    // so the flowing SMIL dots keep their rhythm across status-only updates.
    var sig = pipeline.map(function (s) { return s.id; }).join(">") + "|" + n;
    if (sig !== lastPipeSig) {
      lastPipeSig = sig;
      conns.innerHTML = ""; nodes.innerHTML = "";

      // Connectors first (behind nodes), each with a flowing dot along it.
      for (var i = 0; i < n - 1; i++) {
        var x1 = cx(i) + r + 4, x2 = cx(i + 1) - r - 4, y = top;
        var pathId = "conn-" + i;
        var path = svg("path", { id: pathId, class: "sconn", d: "M" + x1 + "," + y + " L" + x2 + "," + y });
        conns.appendChild(path);
        // Flowing dot (SMIL animateMotion) — hidden until the connector is "live".
        var dot = svg("circle", { class: "flowdot", r: "3.4", fill: "#A3E635" });
        var mm = svg("animateMotion", { dur: "1.7s", repeatCount: "indefinite", rotate: "auto" });
        mm.appendChild(svg("mpath", { href: "#" + pathId }));
        // Older SVG needs xlink; set both.
        mm.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", "#" + pathId);
        dot.appendChild(mm);
        conns.appendChild(dot);
      }

      // Nodes on top.
      pipeline.forEach(function (s, i) {
        var g = svg("g", { class: "snode", "data-i": String(i) });
        g.setAttribute("transform", "translate(" + cx(i) + "," + top + ")");
        g.appendChild(svg("circle", { class: "glow", r: "40", cx: "0", cy: "0", fill: "url(#nodeGlow)" }));
        g.appendChild(svg("circle", { class: "pulse", r: "20", cx: "0", cy: "0", fill: "none", stroke: "#A3E635", "stroke-width": "1.5", opacity: "0" }));
        g.appendChild(svg("circle", { class: "ring", r: String(r), cx: "0", cy: "0" }));
        g.appendChild(svg("circle", { class: "core", r: "7", cx: "0", cy: "0" }));
        var num = svg("text", { class: "snum", x: "0", y: "4", "text-anchor": "middle" });
        num.textContent = String(i + 1);
        g.appendChild(num);
        var tick = svg("path", { class: "tick", d: "M-5,0 l3.5,3.6 l7,-8" });
        g.appendChild(tick);
        var label = svg("text", { class: "slabel", x: "0", y: String(r + 22), "text-anchor": "middle" });
        label.textContent = s.label;
        g.appendChild(label);
        nodes.appendChild(g);
      });
    }

    // Cheap per-poll status refresh: retag nodes + connectors.
    var nodeGs = nodes.querySelectorAll(".snode");
    pipeline.forEach(function (s, i) {
      if (nodeGs[i]) nodeGs[i].setAttribute("class", "snode " + s.status);
    });
    // A connector is "done" if its right node is done/active, "active" (with the
    // live flowing dot) when it leads INTO the active node.
    var activeIdx = pipeline.findIndex(function (s) { return s.status === "active"; });
    var doneCount = pipeline.filter(function (s) { return s.status === "done"; }).length;
    var connPaths = conns.querySelectorAll(".sconn");
    var dots = conns.querySelectorAll(".flowdot");
    for (var i = 0; i < connPaths.length; i++) {
      var leadsIntoActive = (i + 1) === activeIdx;
      var isDone = (i + 1) <= doneCount || (i + 1) < activeIdx || activeIdx < 0 && false;
      var cls = "sconn";
      if (leadsIntoActive) cls += " active sconn-live";
      else if (i < doneCount) cls += " done";
      connPaths[i].setAttribute("class", cls);
      if (dots[i]) dots[i].style.display = leadsIntoActive ? "inline" : "none";
    }
  }

  function renderAgent(a) {
    var card = el("div", "card " + a.status);
    var top = el("div", "card-top");
    top.appendChild(el("span", "emoji", roleEmoji(a.role)));
    top.appendChild(el("span", "name", a.unit || a.id));
    top.appendChild(el("span", "role", a.role));
    var st = el("span", "status " + a.status);
    st.appendChild(el("span", "sdot"));
    st.appendChild(el("span", null, a.status));
    top.appendChild(st);
    card.appendChild(top);

    var sub = el("div", "sub");
    sub.appendChild(el("span", "badge", a.substage));
    if (a.max_iterations) sub.appendChild(el("span", "iter", "iter " + a.iteration + "/" + a.max_iterations));
    card.appendChild(sub);

    var bar = el("div", "bar"); var fill = el("i"); fill.style.width = pct(a.progress) + "%"; bar.appendChild(fill);
    card.appendChild(bar);

    // The agent's OWN GSD flow (discuss→…→done): a compact per-step mini-stepper.
    if (a.flow && a.flow.length) {
      var flow = el("div", "flow");
      a.flow.forEach(function (s) {
        var step = el("div", "flow-step " + s.status);
        var dot = el("span", "fdot", s.status === "done" ? "✓" : (s.status === "blocked" ? "!" : ""));
        step.appendChild(dot);
        step.appendChild(el("span", "flabel", s.label));
        step.title = s.label + " · " + s.status;
        flow.appendChild(step);
      });
      card.appendChild(flow);
    }

    if (a.note) card.appendChild(el("div", "note", a.note));
    if (a.context_pressure && a.context_pressure !== "normal") {
      card.appendChild(el("div", "pressure " + a.context_pressure, "context: " + a.context_pressure));
    }
    // Click a card for the full, untruncated detail (note, flow, meta).
    card.addEventListener("click", function () { openCard(a); });
    return card;
  }

  // ---- Card detail modal ------------------------------------------------
  // The currently-open agent (by id), so live polls refresh the open modal in
  // place — or close it if that agent is gone.
  var openAgentId = null;
  function agentKey(a) { return (a && (a.id || a.unit)) || null; }

  function mStatus(status) {
    var st = el("span", "status m-status " + status);
    st.appendChild(el("span", "sdot"));
    st.appendChild(el("span", null, status));
    return st;
  }

  function renderModal(a) {
    var body = document.getElementById("modal-body");
    body.innerHTML = "";

    var head = el("div", "m-head");
    head.appendChild(el("span", "m-emoji", roleEmoji(a.role)));
    var ht = el("div");
    ht.appendChild(el("div", "m-title", a.unit || a.id || "agent"));
    var subParts = [a.role];
    if (a.id && a.unit && a.id !== a.unit) subParts.push(a.id);
    ht.appendChild(el("div", "m-sub", subParts.filter(Boolean).join(" · ")));
    head.appendChild(ht);
    head.appendChild(mStatus(a.status));
    body.appendChild(head);

    var grid = el("div", "m-grid");
    function cell(k, v) {
      var c = el("div", "m-cell");
      c.appendChild(el("div", "k", k));
      c.appendChild(el("div", "v", v == null || v === "" ? "—" : String(v)));
      grid.appendChild(c);
    }
    cell("Phase", a.phase);
    cell("Substage", a.substage);
    if (a.max_iterations) cell("Iteration", "iter " + (a.iteration || 0) + " / " + a.max_iterations);
    cell("Progress", pct(a.progress) + "%");
    if (a.context_pressure && a.context_pressure !== "normal") cell("Context", a.context_pressure);
    body.appendChild(grid);

    var bar = el("div", "m-bar"); var fi = el("i"); fi.style.width = pct(a.progress) + "%"; bar.appendChild(fi);
    body.appendChild(bar);

    if (a.flow && a.flow.length) {
      body.appendChild(el("div", "m-section-label", "GSD flow"));
      var mf = el("div", "m-flow");
      a.flow.forEach(function (s) {
        var f = el("span", "fstep " + s.status);
        f.appendChild(el("span", "d"));
        f.appendChild(el("span", null, s.label + " · " + s.status));
        mf.appendChild(f);
      });
      body.appendChild(mf);
    }

    body.appendChild(el("div", "m-section-label", "Detail"));
    body.appendChild(el("div", "m-note",
      a.note && String(a.note).trim() ? a.note : "No detail reported yet."));
  }

  function openCard(a) {
    openAgentId = agentKey(a);
    renderModal(a);
    document.getElementById("modal").hidden = false;
  }
  function closeCard() {
    openAgentId = null;
    document.getElementById("modal").hidden = true;
  }

  // Pop a count chip when its value changes, for a live pulse of feedback.
  var lastCounts = {};
  function setCount(id, chipId, val) {
    document.getElementById(id).textContent = val;
    if (lastCounts[id] !== undefined && lastCounts[id] !== val) {
      var chip = document.getElementById(chipId);
      chip.classList.remove("pop"); void chip.offsetWidth; chip.classList.add("pop");
    }
    lastCounts[id] = val;
  }

  function render(model) {
    // Conductor identity (name + emoji) drives the header pill, honoring any
    // rename in BGSD.md. Defaults to Kiwi/🥝.
    var cond = model.conductor || {};
    document.getElementById("pill-emoji").textContent = cond.emoji || "🥝";
    document.getElementById("pill-name").textContent = cond.name || "Kiwi";

    // The session's human-readable title leads the header; fall back to the run
    // id, then to the generic "live view" when there is no session at all.
    document.getElementById("run-title").textContent =
      model.run.title || model.run.run_id || "live view";
    document.getElementById("run-id").textContent = model.run.run_id || "—";
    document.getElementById("run-scale").textContent = model.run.scale || "—";
    document.getElementById("run-state").textContent = model.run.state || "—";
    setCount("c-running", "chip-running", model.counts.running);
    setCount("c-done", "chip-done", model.counts.done);
    setCount("c-blocked", "chip-blocked", model.counts.blocked);
    setCount("c-total", "chip-total", model.counts.total);
    document.getElementById("hero-scope").textContent =
      model.run.scale ? "scale: " + model.run.scale : (model.run.run_id ? "" : "waiting for a session");

    // Overall run status: prefer the model's value, fall back to counts.
    var overall = model.overall || deriveOverall(model.counts);
    var ov = document.getElementById("overall");
    ov.className = "overall " + overall;
    document.getElementById("overall-text").textContent = overall.replace("_", " ");

    // Hero pipeline stepper — visible even before any agent spawns.
    renderPipeline(model.pipeline);

    // What the Conductor is doing right now (its current stage + note).
    var nb = document.getElementById("note-bar");
    nb.innerHTML = "";
    var noRun = !model.run.run_id && model.counts.total === 0 && !model.run.stage;
    if (noRun) {
      var idle = el("span", "muted", "No active session yet. Run ");
      var code = el("b", "tag"); code.style.gap = "0"; code.textContent = "/bgsd-sesh";
      idle.appendChild(code);
      idle.appendChild(document.createTextNode(" and the full pipeline lights up here."));
      nb.appendChild(idle);
    } else if (model.run.stage || model.run.note) {
      var tag = el("span", "tag");
      tag.appendChild(el("span", "spin"));
      tag.appendChild(el("span", null, "Conductor"));
      nb.appendChild(tag);
      nb.appendChild(el("span", "sep", "·"));
      nb.appendChild(el("b", null, model.run.stage || "working"));
      if (model.run.note) {
        nb.appendChild(el("span", "sep", "·"));
        nb.appendChild(el("span", "muted", model.run.note));
      }
    } else if (model.counts.total === 0) {
      nb.appendChild(el("span", "muted", "Conductor is getting set up; agents will appear here as they spawn."));
    }

    var lanes = document.getElementById("lanes");
    lanes.innerHTML = "";
    model.lanes.forEach(function (lane) {
      var col = el("div", "lane");
      var head = el("div", "lane-head");
      head.appendChild(el("span", "lane-title", lane.title));
      head.appendChild(el("span", "lane-count", String(lane.agents.length)));
      col.appendChild(head);
      if (!lane.agents.length) {
        var empty = el("div", "empty", "idle");
        empty.appendChild(el("span", "ph", "no agents here yet"));
        col.appendChild(empty);
      } else lane.agents.forEach(function (a) { col.appendChild(renderAgent(a)); });
      lanes.appendChild(col);
    });

    // Keep an open detail modal live: refresh it from the latest data, or close
    // it if that agent is no longer present.
    if (openAgentId) {
      var open = (model.agents || []).filter(function (x) { return agentKey(x) === openAgentId; })[0];
      if (open) renderModal(open); else closeCard();
    }
  }

  // ---- Idempotent re-render guard ----------------------------------------
  // The poll used to rebuild the board wholesale every 1.5s, recreating every
  // DOM node so CSS transitions and entrance animations restarted each tick
  // (visible blinking). The model is stable between real changes EXCEPT
  // run.generated_at, a fresh server timestamp on every request; compare
  // everything but that stamp and skip the rebuild when nothing changed. The
  // stamp itself is a footer text node updated in place on every tick.
  var lastModelSig = null;
  function modelSignature(model) {
    var run = {};
    for (var k in model.run) { if (k !== "generated_at") run[k] = model.run[k]; }
    return JSON.stringify({
      run: run,
      conductor: model.conductor,
      counts: model.counts,
      overall: model.overall,
      pipeline: model.pipeline,
      lanes: model.lanes,
      agents: model.agents
    });
  }
  function renderIfChanged(model) {
    var sig = modelSignature(model);
    if (sig !== lastModelSig) {
      lastModelSig = sig;
      render(model);
    }
    var stamp = "updated " + new Date(model.run.generated_at).toLocaleTimeString();
    var stampEl = document.getElementById("stamp");
    if (stampEl.textContent !== stamp) stampEl.textContent = stamp;
  }

  function setLive(state, text) {
    var l = document.getElementById("live");
    var cls = "live" + (state ? " " + state : "");
    if (l.className !== cls) l.className = cls;
    var lt = document.getElementById("live-text");
    if (lt.textContent !== text) lt.textContent = text;
  }

  // --- View + selected-run state -----------------------------------------
  var activeTab = "current";
  var viewingRun = null;
  var STATUS_LABEL = { "in-progress": "in progress", "completed": "completed", "aborted": "aborted" };

  function setViewingNote() {
    var note = document.getElementById("viewing-note");
    if (viewingRun) {
      note.hidden = false;
      note.innerHTML = "";
      note.appendChild(document.createTextNode("viewing "));
      note.appendChild(el("b", null, viewingRun));
      var back = el("button", "tab", "return to latest");
      back.style.marginLeft = "8px";
      back.addEventListener("click", function () { selectRun(null); showTab("current"); });
      note.appendChild(back);
    } else {
      note.hidden = true;
      note.innerHTML = "";
    }
  }

  function selectRun(id) {
    viewingRun = id || null;
    setViewingNote();
    tick();
  }

  function stateUrl() {
    return viewingRun ? "/api/state?run=" + encodeURIComponent(viewingRun) : "/api/state";
  }

  function tick() {
    fetch(stateUrl(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (model) { setLive("", "live"); renderIfChanged(model); })
      .catch(function () { setLive("lost", "connection lost, retrying"); });
  }

  function renderSessions(list) {
    var wrap = document.getElementById("sessions");
    wrap.innerHTML = "";
    if (!list || !list.length) { wrap.appendChild(el("div", "empty", "No sessions yet — run /bgsd-sesh \"…\" to start one.")); return; }
    list.forEach(function (s) {
      var row = el("button", "sess st-" + s.status);
      if (viewingRun && s.run_id === viewingRun) row.className += " viewing";

      // Title is the primary label; the run id rides underneath, dim + secondary.
      var idCell = el("div", "sess-id", s.title || s.run_id || "(unknown run)");
      var sub = s.title ? (s.run_id || "") + " · stage: " + (s.stage || "—")
                        : "stage: " + (s.stage || "—");
      idCell.appendChild(el("span", "stage", sub));
      row.appendChild(idCell);

      row.appendChild(el("div", "sess-scale", s.scale || "—"));
      row.appendChild(el("span", "sbadge st-" + s.status, STATUS_LABEL[s.status] || s.status));

      var counts = el("div", "sess-counts");
      counts.appendChild(el("span", "chip run", "running " + (s.counts.running || 0)));
      counts.appendChild(el("span", "chip done", "done " + (s.counts.done || 0)));
      counts.appendChild(el("span", "chip bad", "blocked " + (s.counts.blocked || 0)));
      row.appendChild(counts);

      var when = s.updated_at ? new Date(s.updated_at).toLocaleString() : "—";
      row.appendChild(el("div", "sess-when", when));

      row.addEventListener("click", function () { selectRun(s.run_id); showTab("current"); });
      wrap.appendChild(row);
    });
  }

  // Same idempotence guard for the sessions list: skip the rebuild when the
  // payload is unchanged. viewingRun is part of the signature because it drives
  // the highlighted "viewing" row even when the list itself did not change.
  var lastSessionsSig = null;
  function loadSessions() {
    fetch("/api/sessions", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (list) {
        var sig = JSON.stringify([viewingRun, list]);
        if (sig === lastSessionsSig) return;
        lastSessionsSig = sig;
        renderSessions(list);
      })
      .catch(function () {
        // The error state replaces the list DOM, so force a re-render on recovery.
        lastSessionsSig = null;
        var wrap = document.getElementById("sessions");
        wrap.innerHTML = "";
        wrap.appendChild(el("div", "empty", "could not load sessions, retrying"));
      });
  }

  function showTab(tab) {
    activeTab = tab;
    var isCurrent = tab === "current";
    document.getElementById("tab-current").className = "tab" + (isCurrent ? " active" : "");
    document.getElementById("tab-sessions").className = "tab" + (isCurrent ? "" : " active");
    document.getElementById("view-current").hidden = !isCurrent;
    document.getElementById("view-sessions").hidden = isCurrent;
    if (isCurrent) tick();
    else loadSessions();
  }

  document.getElementById("tab-current").addEventListener("click", function () { showTab("current"); });
  document.getElementById("tab-sessions").addEventListener("click", function () { showTab("sessions"); });

  // Modal dismissal: close button, click on the backdrop, or Escape.
  document.getElementById("modal-close").addEventListener("click", closeCard);
  document.getElementById("modal").addEventListener("click", function (e) { if (e.target && e.target.id === "modal") closeCard(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCard(); });

  // Read ?run=<id> from the URL so a deep-link pins a specific run.
  (function () {
    try {
      var q = new URLSearchParams(window.location.search);
      var r = q.get("run");
      if (r && r.trim()) viewingRun = r.trim();
    } catch (_) {}
  })();

  // Paint the empty pipeline immediately (all-pending) so it never flashes blank.
  renderPipeline([
    { id: "discuss", label: "Discuss", status: "pending" },
    { id: "decompose", label: "Decompose", status: "pending" },
    { id: "loop1", label: "Loop 1", status: "pending" },
    { id: "merge", label: "Merge", status: "pending" },
    { id: "loop2", label: "Loop 2", status: "pending" },
    { id: "review", label: "Review", status: "pending" },
    { id: "done", label: "Done", status: "pending" }
  ]);

  setViewingNote();
  // First load: if there is no active/current run, land on the All-sessions view.
  // Opening the dashboard without a running sesh shows the session list (or a
  // friendly empty state), never an empty pipeline. A ?run deep-link pins Current.
  (function firstLoad() {
    if (viewingRun) { tick(); return; }
    fetch("/api/state", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (model) {
        if (!model || !model.run || !model.run.run_id) { showTab("sessions"); }
        else { setLive("", "live"); renderIfChanged(model); }
      })
      .catch(function () { tick(); });
  })();
  setInterval(function () {
    if (activeTab === "current") tick();
    else loadSessions();
  }, POLL_MS);
</script>
</body>
</html>
